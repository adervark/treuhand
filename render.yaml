# Render Blueprint for Proviso: one Docker web service built from ./Dockerfile,
# plus a cron job that runs the deadline sweep.
#
# Memory: measured locally, the server idles at about 190 MB and peaked at
# 674 MB (server plus headless Chromium) while verifying a simple page. One
# Chromium runs per verification, so concurrent verifications add to that.
# A 512 MB instance (free, 0.5c-512mb) is likely to run out of memory;
# 1c-2g (1 CPU, 2 GB) leaves room.
#
# Storage: SQLite (data/clause.db) and evidence screenshots (data/evidence/)
# live under /app/data. The disk below keeps them across deploys and
# restarts. Disks need a paid plan; without one, every deploy, restart or
# spin-down wipes all contracts, the ledger and the evidence. The container's
# start command runs `pnpm db:init && pnpm db:seed` on every boot, so a wiped
# disk comes back with an empty database and the two demo identities.
#
# Secrets: every variable marked `sync: false` is asked for in the Render
# Dashboard when the Blueprint is first applied. No value is stored here.
# DEMO_PAYER_EMAIL and DEMO_WORKER_EMAIL are required: seeding fails without
# them and the service does not start.

services:
  - type: web
    name: proviso
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: 1c-2g
    region: oregon
    healthCheckPath: /api/contracts
    disk:
      name: clause-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # PayPal sandbox REST app (Merchant), linked to a US sandbox business account
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Optional: a sandbox webhook pointing at https://<this service>/api/webhooks/paypal.
      # Without it the webhook route answers 503; nothing depends on webhooks.
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # DeepSeek, through its OpenAI-compatible API
      - key: DEEPSEEK_API_KEY
        sync: false
      # Optional: defaults to https://api.deepseek.com
      - key: DEEPSEEK_BASE_URL
        sync: false
      # Optional: defaults to deepseek-flash; the model must accept images
      - key: CLAUSE_MODEL
        sync: false
      # Optional: raises GitHub API rate limits for code-bounty checks
      - key: GITHUB_TOKEN
        sync: false
      # Optional: seconds between a pass and the automatic payout; defaults to 0
      - key: CLAUSE_CONTEST_WINDOW_SECONDS
        sync: false
      # Required: the two seeded demo identities, US sandbox personal accounts.
      # Payouts go to the worker's address.
      - key: DEMO_PAYER_EMAIL
        sync: false
      - key: DEMO_WORKER_EMAIL
        sync: false

  # Expires holds past their deadline and finishes pending payouts and splits
  # when no contract page is open to do it. Calls the web service over Render's
  # private network (same region). Billed by run time, $1 monthly minimum.
  - type: cron
    name: proviso-sweep
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: >-
      node -e "fetch('http://' + process.env.CLAUSE_HOSTPORT + '/api/sweep', { method: 'POST' }).then(async (r) => { console.log(r.status, await r.text()); if (!r.ok) process.exit(1); }, (e) => { console.error(e); process.exit(1); })"
    envVars:
      - key: CLAUSE_HOSTPORT
        fromService:
          type: web
          name: proviso
          property: hostport
